<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Activities">
<title>Centre Activities</title>
<style>
  :root {
    --bg:#FFF7EC; --card:#FFFFFF; --ink:#2A2430; --muted:#645D6E; --line:#E7DCCB;
    --teal:#0F766E; --teal-dark:#0B5B55; --teal-soft:#E3F3F0;
    --orange:#C2410C; --orange-dark:#8F2F08; --slate:#26303B;
    --warn-bg:#FEF3C7; --warn:#6B3B05;
    --desc:1.35rem;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); line-height:1.4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","Noto Sans SC","Noto Sans TC","Noto Sans Tamil",sans-serif;
  }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible { outline:4px solid #F59E0B; outline-offset:2px; }
  .wrap { max-width:980px; margin:0 auto; padding:14px 16px 40px; }

  /* header */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .top h1 { margin:0; font-size:clamp(1.25rem,3.4vw,1.7rem); line-height:1.2; }
  .top .date { margin:2px 0 0; font-size:1.15rem; color:var(--muted); font-weight:600; }
  .size { display:inline-flex; gap:8px; }
  .controls { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 10px; border-bottom:2px solid var(--line); margin-bottom:6px; }
  .langs, .views { display:flex; flex-wrap:wrap; gap:8px; }
  .views { margin-top:10px; align-items:center; }
  .seg { display:inline-flex; border:3px solid var(--slate); border-radius:18px; overflow:hidden; background:var(--card); }
  .seg button { min-height:52px; padding:0 18px; border:0; background:transparent; color:var(--slate); font-size:1.25rem; font-weight:800; display:inline-flex; align-items:center; gap:8px; }
  .seg button + button { border-left:3px solid var(--slate); }
  .seg button[aria-pressed="true"] { background:var(--slate); color:#fff; }
  .rng { display:flex; flex-wrap:wrap; gap:8px; }
  .lang {
    min-height:58px; padding:6px 16px; border-radius:16px; border:3px solid var(--teal); background:var(--card); color:var(--teal-dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1;
  }
  .lang .main { font-size:1.3rem; font-weight:800; }
  .lang .sub { font-size:.8rem; font-weight:600; opacity:.85; }
  .lang[aria-pressed="true"] { background:var(--teal); color:#fff; box-shadow:0 4px 0 var(--teal-dark); }
  .view {
    min-height:58px; padding:0 22px; border-radius:16px; border:3px solid var(--slate); background:var(--card); color:var(--slate);
    font-size:1.3rem; font-weight:800;
  }
  .view[aria-pressed="true"] { background:var(--slate); color:#fff; }
  .tool { min-height:52px; padding:0 16px; border-radius:14px; border:2px solid var(--line); background:var(--card); font-size:1.1rem; font-weight:700; color:var(--ink); }
  .tool[aria-pressed="true"] { border-color:var(--teal); background:var(--teal-soft); color:var(--teal-dark); }
  .spacer { flex:1; }

  /* list */
  .day { margin:24px 0 10px; font-size:1.5rem; font-weight:800; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .day .istoday { font-size:1rem; padding:3px 12px; border-radius:999px; background:var(--orange); color:#fff; }
  .card {
    display:grid; grid-template-columns:210px 1fr; background:var(--card); border:2px solid var(--line);
    border-left:10px solid var(--c,#8A8A8A); border-radius:20px; margin-bottom:14px; overflow:hidden;
  }
  .card.now { box-shadow:0 0 0 4px #F59E0B; }
  .card.done { opacity:.62; }
  .card.cancelled { opacity:.85; background:#FAF6F6; }
  .cat-exercise { --c:#2F855A; --t:#E6F4EA; --m:#BFE3CB; } .cat-games { --c:#C2185B; --t:#FCE8F1; --m:#F6BFD7; } .cat-social { --c:#C2410C; --t:#FDEDE2; --m:#F8C9A8; }
  .cat-talk { --c:#1D4ED8; --t:#E6EDFC; --m:#BFD0F7; } .cat-health { --c:#7E22CE; --t:#F3E8FF; --m:#DDBFF7; } .cat-notice { --c:#6B7280; --t:#EEEEEE; --m:#D4D4D8; }
  .side { display:flex; flex-direction:column; background:var(--t,#F1F1F1); }
  .art { position:relative; flex:1 1 auto; min-height:150px; overflow:hidden; display:grid; place-items:center;
    background:radial-gradient(circle at 30% 25%, #fff 0, var(--t) 38%, var(--m) 100%); }
  .art .big { font-size:4.8rem; line-height:1; filter:drop-shadow(0 6px 6px rgba(0,0,0,.18)); transform:rotate(-4deg); }
  .art .sm { position:absolute; font-size:1.9rem; line-height:1; opacity:.92; }
  .art .s1 { top:10px; left:12px; transform:rotate(-12deg); } .art .s2 { bottom:10px; right:12px; transform:rotate(10deg); } .art .s3 { top:12px; right:14px; font-size:1.5rem; opacity:.7; }
  .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .art .pin { position:absolute; left:10px; bottom:10px; width:50px; height:50px; border-radius:50%; background:#fff; display:none; place-items:center; font-size:1.9rem; box-shadow:0 2px 6px rgba(0,0,0,.3); z-index:1; }
  .art.has-img .pin { display:grid; }
  .cancelled .art { filter:grayscale(.85); }
  .time { padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:2px; border-top:3px solid var(--c); }
  .time .t1 { font-size:1.55rem; font-weight:800; line-height:1.15; }
  .time .t2 { font-size:1.1rem; font-weight:600; color:var(--muted); }
  .cancelled .time .t1, .cancelled .time .t2 { text-decoration:line-through; }
  .body { padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .body h3 { margin:0; font-size:1.65rem; line-height:1.2; display:flex; gap:12px; align-items:flex-start; overflow-wrap:anywhere; }
  .body h3 .ic { font-size:1.9rem; line-height:1; flex:none; }
  .body h3 .sub { display:block; font-size:1.05rem; font-weight:600; color:var(--muted); margin-top:3px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; font-size:1.1rem; font-weight:600; }
  .badge { padding:4px 12px; border-radius:999px; font-size:1rem; font-weight:800; }
  .b-reg { background:#E6EDFC; color:#173FA6; } .b-walk { background:#DDF3E4; color:#14663A; }
  .b-now { background:#F59E0B; color:#3A2200; } .b-done { background:#E5E1DA; color:#4B4650; }
  .b-cancel { background:#FBE3E3; color:#8E1B1B; } .b-note { background:#EFE9DD; color:#4B4650; } .b-full { background:#FDE68A; color:#5A3A00; }
  .where { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:#F4EEE2; }
  .desc { margin:0; font-size:var(--desc); line-height:1.55; overflow-wrap:anywhere; }
  .listen {
    align-self:flex-start; min-height:64px; padding:0 28px; border:none; border-radius:18px; background:var(--orange); color:#fff;
    font-size:1.45rem; font-weight:800; display:inline-flex; align-items:center; gap:12px; box-shadow:0 5px 0 var(--orange-dark);
    transition:transform .08s, box-shadow .08s;
  }
  .listen:active { transform:translateY(4px); box-shadow:0 1px 0 var(--orange-dark); }
  .listen.playing { background:var(--slate); box-shadow:0 5px 0 #10161C; }
  .listen svg { width:30px; height:30px; flex:none; }
  .eq { display:none; align-items:flex-end; gap:4px; height:24px; }
  .listen.playing .eq { display:inline-flex; }
  .eq i { width:6px; background:#fff; border-radius:3px; height:8px; animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2){animation-delay:.15s} .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq { 0%,100%{height:8px} 50%{height:22px} }
  .note { padding:12px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn); font-size:1.1rem; font-weight:600; }
  .empty { background:var(--card); border:2px dashed var(--line); border-radius:20px; padding:30px 22px; text-align:center; font-size:1.5rem; font-weight:700; }
  .empty .tool { margin-top:16px; font-size:1.3rem; min-height:60px; }
  .setup { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:22px; font-size:1.15rem; }
  .setup code { background:#F4EEE2; padding:2px 6px; border-radius:6px; }
  /* month calendar */
  .calhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:18px 0 12px; }
  .calhead h2 { margin:0; font-size:clamp(1.5rem,4vw,2.1rem); flex:1; min-width:150px; text-align:center; }
  .nav { min-height:60px; min-width:60px; padding:0 18px; border-radius:16px; border:3px solid var(--slate); background:var(--card); color:var(--slate); font-size:1.6rem; font-weight:800; line-height:1; }
  .nav:disabled { opacity:.3; cursor:default; }
  .nav.today { font-size:1.15rem; }
  .grid { display:grid; gap:6px; grid-template-columns:repeat(var(--cols,5), minmax(0,1fr)); }
  .dow { text-align:center; font-weight:800; font-size:1.1rem; color:var(--muted); padding:4px 0; }
  .cell { text-align:left; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:8px 8px 8px; min-height:176px; display:flex; flex-direction:column; gap:5px; font:inherit; color:inherit; min-width:0; }
  button.cell:active { transform:scale(.98); }
  .cell.off { background:transparent; border:2px dashed var(--line); opacity:.55; }
  .cell.today { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange); }
  .cell.hol { background:#FFF3DA; }
  .cell.empty { background:#FBF7EF; }
  .dn { display:flex; align-items:center; justify-content:space-between; font-size:1.45rem; font-weight:800; line-height:1; }
  .dn .tag { font-size:.8rem; padding:2px 8px; border-radius:999px; background:var(--orange); color:#fff; }
  .chip { display:grid; grid-template-columns:auto 1fr; column-gap:6px; align-items:center; padding:4px 6px; border-radius:10px; background:var(--t); border-left:6px solid var(--c); min-width:0; }
  .chip .ci { font-size:1.35rem; line-height:1; grid-row:1 / span 2; }
  .chip .ct { font-size:.82rem; font-weight:800; color:var(--c); line-height:1.1; }
  .chip .cn { font-size:.9rem; font-weight:700; line-height:1.15; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  .chip.x { background:#F3F0F0; border-left-color:#C4B5B5; opacity:.8; }
  .chip.x .cn, .chip.x .ct { text-decoration:line-through; color:#7A6F6F; }
  .more { font-size:.95rem; font-weight:800; color:var(--muted); padding-left:4px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:16px; font-size:1.05rem; font-weight:700; }
  .legend span { display:inline-flex; align-items:center; gap:6px; padding:4px 12px 4px 8px; border-radius:999px; background:var(--t); border:2px solid var(--c); }
  .hint { margin:10px 0 0; text-align:center; color:var(--muted); font-size:1.05rem; font-weight:600; }

  /* day sheet */
  body.lock { overflow:hidden; }
  .sheet { position:fixed; inset:0; z-index:20; display:flex; justify-content:center; align-items:flex-end; }
  .sheet-bg { position:absolute; inset:0; background:rgba(20,16,24,.55); }
  .sheet-panel { position:relative; width:min(980px,100%); max-height:94vh; background:var(--bg); border-radius:28px 28px 0 0; display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.35); }
  .sheet-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:2px solid var(--line); flex-wrap:wrap; }
  .sheet-head h2 { margin:0; flex:1; min-width:180px; font-size:clamp(1.3rem,3.6vw,1.8rem); text-align:center; }
  .sheet-body { overflow:auto; padding:16px 16px 28px; -webkit-overflow-scrolling:touch; }
  .closebtn { min-height:60px; padding:0 22px; border-radius:16px; border:0; background:var(--orange); color:#fff; font-size:1.3rem; font-weight:800; box-shadow:0 4px 0 var(--orange-dark); }
  .sheet .empty { margin:0; }

  footer { margin-top:30px; padding-top:14px; border-top:2px solid var(--line); color:var(--muted); font-size:1.05rem; }
  footer p { margin:4px 0; }
  footer .meta-small { font-size:.9rem; margin-top:12px; }
  @media (max-width:760px) {
    .cell { min-height:92px; padding:6px; border-radius:12px; }
    .grid { gap:4px; }
    .dn { font-size:1.15rem; } .dn .tag { display:none; }
    .cell .cn, .cell .ct { display:none; }
    .cell .chips { display:flex; flex-wrap:wrap; gap:3px; }
    .chip { display:inline-flex; padding:2px 3px; border-left-width:3px; }
    .chip .ci { font-size:1.2rem; }
    .dow { font-size:.95rem; }
  }
  @media (max-width:640px) {
    .controls { position:static; }
    .card { grid-template-columns:1fr; }
    .art { min-height:0; height:130px; }
    .calhead { gap:6px; flex-wrap:nowrap; }
    .calhead h2 { min-width:0; font-size:1.2rem; line-height:1.2; }
    .nav { min-width:50px; min-height:54px; padding:0 10px; }
    .nav.today { font-size:1rem; padding:0 12px; }
    .sheet-head { gap:6px; } .sheet-head h2 { min-width:0; flex-basis:100%; order:-1; }
    .closebtn { padding:0 14px; flex:1; }
    .seg button { padding:0 12px; font-size:1.1rem; }
    .time { flex-direction:row; align-items:baseline; gap:10px; flex-wrap:wrap; padding:12px 16px; }
    .listen { width:100%; justify-content:center; }
    .view { flex:1; padding:0 8px; font-size:1.1rem; }
  }
  @media (prefers-reduced-motion:reduce) { .eq i { animation:none; height:16px; } .listen { transition:none; } }
</style>
</head>

<div class="sheet" id="sheet" hidden></div>

<script src="config.js"></script>
<script src="demo-data.js"></script>

        if ((r.title || '').trim()) o.title = r.title.trim();
        if ((r.note || '').trim()) o.note = r.note.trim();

  const nm = namesFor(o, lang);
  const loc = o.location || CFG.defaultLocation;
  const end = o.end != null ? o.end : (o.start != null ? o.start + 60 : null);
  const finished = isToday && o.status !== 'cancelled' && end != null && nowMin >= end;
  const ongoing = isToday && o.status !== 'cancelled' && o.start != null && nowMin >= o.start && nowMin < end;
  const card = el('article', { class: 'card cat-' + cat + (o.status === 'cancelled' ? ' cancelled' : '') + (finished ? ' done' : '') + (ongoing ? ' now' : '') });
  card.append(el('div', { class: 'side' }, artFor(o), el('div', { class: 'time' },
    el('span', { class: 't1' }, o.start != null ? fmtTime(o.start, lang) : ui.allday),
    o.end != null ? el('span', { class: 't2' }, '– ' + fmtTime(o.end, lang)) : null)));
  const body = el('div', { class: 'body' });
  body.append(el('h3', {}, el('span', { class: 'ic', 'aria-hidden': 'true' }, iconsOf(o).main),
    el('span', {}, nm.main, nm.sub ? el('span', { class: 'sub' }, nm.sub) : null)));
  body.append(el('div', { class: 'meta' }, loc ? el('span', { class: 'where' }, locIcon(loc) + ' ' + loc) : null, ...badgesFor(o, ui, isToday, nowMin)));
  const text = descFor(o, lang);
  if (text && o.status !== 'cancelled') body.append(el('p', { class: 'desc', lang: ({ en:'en', zh:'zh-CN', ms:'ms', ta:'ta', yue:'yue-HK' }[lang] || 'zh-CN') }, text));
  if (o.status !== 'cancelled' && canListen(o, lang)) {
    const note = el('div', { class: 'note', role: 'status', hidden: true });
    const ic = el('span', { 'aria-hidden': 'true', style: 'display:inline-flex' }); ic.innerHTML = SPEAKER;
    const btn = el('button', { class: 'listen', type: 'button', 'aria-label': ui.listen + ': ' + nm.main }, ic, el('span', { class: 'lab' }, ui.listen), el('span', { class: 'eq', 'aria-hidden': 'true' }, el('i'), el('i'), el('i')));
    btn.addEventListener('click', () => {
      if (btn.classList.contains('playing')) { player.stop(); return; }
      document.querySelectorAll('.note').forEach(n => { n.hidden = true; });
      activeBtn = btn; failBox = note;
      player.play({ text: nm.main + '. ' + text, def: LANG[lang], audioUrl: resolveAsset(l['audio_' + lang]), slow: state.slow });
    });
    body.append(btn, note);
  }
  card.append(body);
  return card;
}

/* ---- list view ---- */
function renderList(main) {
  const ui = UI[state.lang];
  const monday = mondayOf(TODAY);
  let from, to;
  if (state.view === 'today') { from = to = TODAY; }
  else if (state.view === 'week') { from = TODAY; to = addDays(monday, 6); }
  else { from = addDays(monday, 7); to = addDays(monday, 13); }
  const list = occIn(from, to);
  if (!list.length) {
    const box = el('div', { class: 'empty' }, state.view === 'today' && isPlanned(TODAY) ? ui.none : ui.none2);
    if (state.view === 'today') box.append(el('div', {}, el('button', { class: 'tool', type: 'button', onclick: () => { state.view = 'week'; render(); } }, ui.see)));
    main.append(box); return;
  }
  const nowMin = nowMinutes();
  let lastDate = null;
  list.forEach(o => {
    if (state.view !== 'today' && o.date !== lastDate) {
      main.append(el('h2', { class: 'day' }, fmtDay(o.date, state.lang), o.date === TODAY ? el('span', { class: 'istoday' }, ui.today) : null));
      lastDate = o.date;
    }
    main.append(renderCard(o, o.date === TODAY, nowMin));
  });
}

/* ---- month calendar ---- */
const monthOf = iso => iso.slice(0, 7);
const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1, 12); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
function monthBounds() {
  const hz = DATA.hz;
  return { min: hz.from ? monthOf(hz.from) : shiftMonth(monthOf(TODAY), -6), max: hz.until ? monthOf(hz.until) : shiftMonth(monthOf(TODAY), 6) };
}
function clampMonth(ym) { const b = monthBounds(); return ym < b.min ? b.min : ym > b.max ? b.max : ym; }
const shortTime = (m, lang) => (m % 60 === 0) ? fmt(new Date(2000, 0, 1, m / 60), LANG[lang].locale, { hour: 'numeric' }) : fmtTime(m, lang);
const MAX_CHIPS = 4;

function chipFor(o, lang, ui) {
  const nm = namesFor(o, lang);
  return el('span', { class: 'chip cat-' + catOf(o) + (o.status === 'cancelled' ? ' x' : '') },
    el('span', { class: 'ci', 'aria-hidden': 'true' }, iconsOf(o).main),
    el('span', { class: 'ct' }, o.start != null ? shortTime(o.start, lang) : ui.allday),
    el('span', { class: 'cn' }, nm.main));
}

function renderCalendar(main) {
  const lang = state.lang, ui = UI[lang];
  if (!state.month) state.month = monthOf(TODAY);
  state.month = clampMonth(state.month);
  const [Y, M] = state.month.split('-').map(Number);
  const first = Y + '-' + pad(M) + '-01', last = toISO(new Date(Y, M, 0, 12));
  const occ = occIn(first, last);
  const byDate = new Map(); occ.forEach(o => { if (!byDate.has(o.date)) byDate.set(o.date, []); byDate.get(o.date).push(o); });
  const weekend = occ.some(o => { const g = fromISO(o.date).getDay(); return g === 0 || g === 6; });
  const cols = weekend ? 7 : 5; state.cols = cols;
  const b = monthBounds();

  const head = el('div', { class: 'calhead' },
    el('button', { class: 'nav', type: 'button', 'data-nav': 'prev', 'aria-label': ui.prev, disabled: state.month <= b.min, onclick: () => { state.month = shiftMonth(state.month, -1); render(); } }, '‹'),
    el('h2', {}, fmt(fromISO(first), LANG[lang].locale, { month: 'long', year: 'numeric' })),
    el('button', { class: 'nav today', type: 'button', 'data-nav': 'today', onclick: () => { state.month = monthOf(TODAY); render(); } }, ui.today),
    el('button', { class: 'nav', type: 'button', 'data-nav': 'next', 'aria-label': ui.next2, disabled: state.month >= b.max, onclick: () => { state.month = shiftMonth(state.month, 1); render(); } }, '›'));
  main.append(head);

  const grid = el('div', { class: 'grid', role: 'grid', style: '--cols:' + cols });
  const mon = mondayOf(first);
  for (let k = 0; k < cols; k++) grid.append(el('div', { class: 'dow', role: 'columnheader' }, fmt(fromISO(addDays(mon, k)), LANG[lang].locale, { weekday: 'short' })));
  const nowMin = nowMinutes();
  for (let d = first, n = 0; d <= last; d = addDays(d, 1), n++) {
    const idx = (fromISO(d).getDay() + 6) % 7;
    if (idx >= cols) continue;
    const style = (d === first || n === 0) ? 'grid-column-start:' + (idx + 1) : null;
    const list = byDate.get(d) || [];
    const planned = isPlanned(d);
    const act = list.filter(o => o.status !== 'cancelled');
    const shown = list.slice().sort((x, y) => (x.status === 'cancelled') - (y.status === 'cancelled'));
    const num = el('span', {}, String(+d.slice(8)));
    const dn = el('div', { class: 'dn' }, num, d === TODAY ? el('span', { class: 'tag' }, ui.today) : null);
    if (!planned) { grid.append(el('div', { class: 'cell off', style, 'data-date': d }, dn)); continue; }
    const hol = act.some(o => catOf(o) === 'notice' && o.start == null);
    const chips = el('div', { class: 'chips' });
    shown.slice(0, MAX_CHIPS).forEach(o => chips.append(chipFor(o, lang, ui)));
    if (shown.length > MAX_CHIPS) chips.append(el('span', { class: 'more' }, '+' + (shown.length - MAX_CHIPS) + ' ' + ui.more));
    grid.append(el('button', { class: 'cell' + (d === TODAY ? ' today' : '') + (hol ? ' hol' : '') + (list.length ? '' : ' empty'), type: 'button', style, 'data-date': d,
      'aria-label': fmtDay(d, lang) + (act.length ? ': ' + act.map(o => namesFor(o, lang).main).join(', ') : ''), onclick: () => openDay(d) }, dn, chips));
  }
  main.append(grid);

  const legend = el('div', { class: 'legend', 'aria-hidden': 'true' });
  CATS.forEach(c => legend.append(el('span', { class: 'cat-' + c }, ICON_BY_CAT[c], ui.cats[c])));
  main.append(legend, el('p', { class: 'hint' }, '👆 ' + ui.tap));
}

/* ---- day sheet (opens when a day is touched in the calendar) ---- */
function stepDay(iso, dir) {
  let d = iso;
  for (let i = 0; i < 7; i++) {
    d = addDays(d, dir);
    const idx = (fromISO(d).getDay() + 6) % 7;
    if (idx < (state.cols || 7)) return d;
  }
  return iso;
}
function openDay(iso) {
  state.dayOpen = iso; state.month = monthOf(iso);
  player.stop(); activeBtn = failBox = null;
  renderSheet();
  const b = document.querySelector('#sheet .closebtn'); if (b) b.focus();
}
function closeDay() {
  const was = state.dayOpen; state.dayOpen = null; player.stop(); activeBtn = failBox = null;
  renderSheet();
  if (was) { const c = document.querySelector('.cell[data-date="' + was + '"]'); if (c && c.focus) c.focus({ preventScroll: true }); }
}
function renderSheet() {
  const sh = document.getElementById('sheet');
  if (!state.dayOpen || !DATA || DATA.error || state.mode !== 'cal') { sh.hidden = true; sh.innerHTML = ''; document.body.classList.remove('lock'); return; }
  const lang = state.lang, ui = UI[lang], iso = state.dayOpen;
  sh.innerHTML = ''; sh.hidden = false; document.body.classList.add('lock');
  const prev = stepDay(iso, -1), next = stepDay(iso, 1);
  const go = d => () => { state.dayOpen = d; state.month = monthOf(d); player.stop(); activeBtn = failBox = null; render(); const b = document.querySelector('#sheet .closebtn'); if (b) b.focus(); };
  const list = occIn(iso, iso), nowMin = nowMinutes();
  const body = el('div', { class: 'sheet-body' });
  if (!list.length) body.append(el('div', { class: 'empty' }, isPlanned(iso) ? ui.none : ui.none2));
  list.forEach(o => body.append(renderCard(o, iso === TODAY, nowMin)));
  sh.append(el('div', { class: 'sheet-bg', onclick: closeDay }),
    el('div', { class: 'sheet-panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': fmtDay(iso, lang) },
      el('div', { class: 'sheet-head' },
        el('button', { class: 'nav', type: 'button', 'data-nav': 'dayprev', 'aria-label': ui.prev, disabled: !isPlanned(prev), onclick: go(prev) }, '‹'),
        el('h2', {}, fmtDay(iso, lang), iso === TODAY ? el('span', { class: 'istoday', style: 'margin-left:10px;font-size:1rem;padding:3px 12px;border-radius:999px;background:var(--orange);color:#fff;white-space:nowrap' }, ui.today) : null),
        el('button', { class: 'nav', type: 'button', 'data-nav': 'daynext', 'aria-label': ui.next2, disabled: !isPlanned(next), onclick: go(next) }, '›'),
        el('button', { class: 'closebtn', type: 'button', onclick: closeDay }, '✕ ' + ui.close)),
      body));
}

function renderMain() {
  const main = document.getElementById('main'); main.innerHTML = '';
  const ui = UI[state.lang];
  if (!DATA) { main.append(el('div', { class: 'empty' }, ui.loading)); return; }
  if (DATA.error) {
    main.append(el('div', { class: 'setup' }, el('strong', {}, 'Setup needed. '),
      'Open ', el('code', {}, 'config.js'), ' and paste your three Google Sheet links (Events, Weekly, Changes), or add ', el('code', {}, 'demo-data.js'), ' to see a sample. ', DATA.error));
    return;
  }
  if (state.mode === 'cal') renderCalendar(main); else renderList(main);
}

function renderFoot() {
  const f = document.getElementById('foot'); f.innerHTML = '';
  (CFG.footer || []).forEach(t => f.append(el('p', {}, t)));
  if (DATA && DATA.stamp) {
    const d = new Date(DATA.stamp);
    f.append(el('p', { class: 'meta-small' }, UI[state.lang].updated + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) +
      (DATA.demo ? '  ·  Sample schedule – connect your Google Sheet in config.js' : '') + (DATA.stale ? '  ·  (saved copy – could not reach the Google Sheet)' : '')));
  }
}

function setSize(i) {
  state.sizeIdx = Math.max(0, Math.min(DESC_SIZES.length - 1, i)); store('cal-size', String(state.sizeIdx));
  document.documentElement.style.setProperty('--desc', DESC_SIZES[state.sizeIdx] + 'rem');
}
function render() {
  player.stop(); activeBtn = failBox = null;
  document.documentElement.lang = ({ en:'en', zh:'zh-CN', ms:'ms', ta:'ta', yue:'yue-HK' }[state.lang] || 'zh-CN');
  renderTop(); renderMain(); renderSheet(); renderFoot();
}

/* ------------------------------ loading data ------------------------------ */
async function fetchText(url) {
  const u = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
  const r = await fetch(u, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}
function buildData(texts, extra) {
  const events = parseCSV(texts.events), weekly = parseCSV(texts.weekly), changes = parseCSV(texts.changes || '');
  const lib = new Map(); events.forEach(r => { if ((r.event || '').trim()) lib.set(keyOf(r.event), r); });
  const langs = LANGS.filter(l => l.code === 'en' || events.some(r => (r['desc_' + l.code] || '').trim() || (r['audio_' + l.code] || '').trim())).map(l => l.code);
  const hz = { from: CFG.scheduleFrom ? (parseDate(CFG.scheduleFrom) || '') : '', until: CFG.scheduleUntil ? (parseDate(CFG.scheduleUntil) || '') : '' };
  if (!hz.until) {                         // automatic: end of the last month that has a row in Changes
    let max = ''; changes.forEach(r => { const d = parseDate(r.date); if (d && d > max) max = d; });
    if (max) { const [y, m] = max.split('-').map(Number); hz.until = toISO(new Date(y, m, 0, 12)); }
  }
  return Object.assign({ lib, weekly, changes, langs, hz, stamp: Date.now() }, extra || {});
}
async function load() {
  const S = CFG.sheets || {};
  let texts = null, extra = {};
  if (S.events && S.weekly) {
    try {
      const [events, weekly, changes] = await Promise.all([fetchText(S.events), fetchText(S.weekly), S.changes ? fetchText(S.changes) : Promise.resolve('')]);
      texts = { events, weekly, changes };
      store('cal-cache', JSON.stringify(texts));
    } catch (e) {
      const c = store('cal-cache');
      if (c) { try { texts = JSON.parse(c); extra.stale = true; } catch (x) {} }
      if (!texts) { DATA = { error: 'Could not read the Google Sheet (' + e.message + '). Check that each tab is published as CSV.' }; render(); return; }
    }
  } else if (window.DEMO_CSV) { texts = window.DEMO_CSV; extra.demo = true; }
  else { DATA = { error: '' }; render(); return; }
  if (state.lang && DATA && DATA.langs && !DATA.langs.includes(state.lang)) state.lang = 'en';
  try { DATA = buildData(texts, extra); }
  catch (e) { DATA = { error: 'The sheet could not be read (' + e.message + ').' }; }
  if (DATA.langs && !DATA.langs.includes(state.lang)) state.lang = 'en';
  render();
}

/* ------------------------- kiosk behaviour & start ------------------------- */
let lastTouch = Date.now();
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true }));
if (IDLE > 0) setInterval(() => {
  if (Date.now() - lastTouch < IDLE * 1000) return;
  if (state.lang !== 'en' || state.view !== 'today' || state.mode !== 'list' || state.dayOpen || window.scrollY > 0) {
    state.lang = 'en'; state.view = 'today'; state.mode = 'list'; state.dayOpen = null; state.month = ''; render(); window.scrollTo(0, 0);
  }
}, 1000);
if (hasTTS) {
  let t = null;
  speechSynthesis.onvoiceschanged = () => { clearTimeout(t); t = setTimeout(() => { if (!document.querySelector('.listen.playing')) render(); }, 200); };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && CFG.sheets && CFG.sheets.events) load(); });
if (CFG.refreshMinutes > 0 && CFG.sheets && CFG.sheets.events) setInterval(() => { if (!document.querySelector('.listen.playing')) load(); }, CFG.refreshMinutes * 60000);

setSize(state.sizeIdx);
render();
load();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.dayOpen) closeDay(); });
window.__cal = { parseCSV, parseTime, parseDate, buildOccurrences, state, render, occIn, openDay, closeDay, get data() { return DATA; } };
})();
</script>
</body>
